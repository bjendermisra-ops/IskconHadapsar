name: Publish devotional media refresh
on:
  push:
    branches: [media-refresh-20261124]
    paths: ['.github/workflows/media-refresh.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Verify original MP3s and prepare covers and separate media tabs
        run: |
          python - <<'PY'
          import json, hashlib, urllib.request, subprocess
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          rows = [["hare-rama-krishna-meditation","Hare Rama Krishna — Meditation","Hare Rama Krishna mantra • Meditation edition","c481db6f-b431-4d52-8e05-b154b05fbcb9","45071b2189819c13e07aebec176e58d3bc936f4ff186e7221374bf26bb02e4d7","krishna-divine-flute-thumb.webp","#263b61",21],["hare-krishna-lofi","Hare Rama Hare Krishna — Lo-fi","Hare Rama Hare Krishna mantra • Lo-fi edition","27912df5-29c1-4b01-b493-feb300630af0","9f60312fea0eed534e74f79c136d596ae30836e7d85be1a26ddbf25d254a182b","midnight-lotus-thumb.webp","#644579",31],["hare-krishna-bhajan","Hare Krishna — Bhajan","Hare Krishna mantra • Bhajan edition","79f5c27e-3b34-46e3-a6aa-8341db97e512","b7f1223e1fc3a5e60b0fc962c01edd6db1ba5815ffe55bd64adc4ac03ce54aef","radha-krishna-aarti-thumb.webp","#8b4a30",16],["hare-krishna-hare-rama","Hare Krishna Hare Rama","Maha mantra • 30-second ringtone","188a22f2-f3c8-4871-8275-f68edee0df76","d20331d95399b828522ab5d6f7fa4ff4b0a43ad47b8e46d822340492406a5588","shyamasundara-darshan-thumb.webp","#28585a",30],["hare-krishna-bhakti","Hare Krishna — Bhakti","Hare Krishna mantra • Bhakti edition","c0a06a49-4d87-44f4-9017-5adfe514f1df","9346bc8f220d65965ab319ce842ce6598e9281fc99fec9d35a4dc79b6c920966","gaura-nitai-sankirtan-thumb.webp","#84622c",13],["hare-krishna-ringtone","Hare Krishna — 19-second Edition","Hare Krishna mantra • Short ringtone","23ff0380-6959-4db4-bfa6-1c3911ccac38","7e6aae9956f1aca2069dbe6f5a6c495a759f22f45f1aa782e4039a421534d78a","little-krishna-thumb.webp","#3d5376",19]]
          root=Path("media")
          catalog=root/"catalog.json"
          items=json.loads(catalog.read_text())
          for slug,title,description,source,checksum,cover,colour,duration in rows:
              data=urllib.request.urlopen("https://d2ol7oe51mr4n9.cloudfront.net/user_3MOwHGASMZSJ85CC77e8MgccK7g/"+source+".mp3",timeout=60).read()
              assert hashlib.sha256(data).hexdigest()==checksum,slug
              audio=root/(slug+".mp3")
              audio.write_bytes(data)
              actual=float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","default=nw=1:nk=1",str(audio)]))
              assert abs(actual-duration)<1,slug
              subprocess.run(["ffmpeg","-v","error","-i",str(audio),"-f","null","-"],check=True)
              base=Image.new("RGB",(256,256),colour)
              art=ImageOps.fit(Image.open(root/cover).convert("RGB"),(236,236),Image.Resampling.LANCZOS,centering=(0.5,0.46))
              base.paste(art,(10,10))
              draw=ImageDraw.Draw(base)
              draw.rounded_rectangle((170,170,246,246),radius=21,fill=colour,outline="#eacb95",width=3)
              draw.line((203,184,203,219),fill="#fff1d1",width=5)
              draw.line((203,185,225,179),fill="#fff1d1",width=5)
              draw.line((225,179,225,209),fill="#fff1d1",width=5)
              draw.ellipse((187,212,205,225),fill="#fff1d1")
              draw.ellipse((209,202,227,215),fill="#fff1d1")
              base.save(root/(slug+"-cover.webp"),"WEBP",quality=90,method=5)
              url="/media/"+slug+".mp3"
              if not any(item.get("url")==url for item in items):
                  items.append(dict(kind="audio",title=title,description=description,url=url,thumbnail="/media/"+slug+"-cover.webp",durationSeconds=duration))
          catalog.write_text(json.dumps(items,ensure_ascii=False,indent=2)+"\n")
          Path("media.html").write_text("<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"theme-color\" content=\"#faf6ef\"><title>Devotional media · ISKCON Hadapsar</title><script src=\"/temple-share.js?v=2\"></script>\n<style>\n:root{--paper:#faf6ef;--card:#fffdf8;--ink:#2e2530;--muted:#736778;--accent:#563952;--line:#e8ded6;--gold:#e8c17e}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--paper);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}main{max-width:960px;margin:auto;padding:20px 16px 56px}nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:24px}nav a{color:inherit;text-decoration:none;font-weight:650}button{font:inherit;color:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:8px 12px;font-weight:650}button:focus-visible,a:focus-visible{outline:3px solid #b17c3d;outline-offset:3px}.hero{background:#352739;border-radius:20px;color:#fff5e5;padding:24px;display:flex;gap:18px;align-items:center}.brand-mark{flex:none;width:58px;height:58px;color:var(--gold)}.eyebrow{font-size:11px;font-weight:750;letter-spacing:1.5px;color:var(--gold);margin:0 0 6px}h1,h2,h3,p{margin:0}h1{font:500 clamp(27px,5vw,42px) Georgia,serif;line-height:1.12}header p:last-child{font-size:13px;color:#e1d4df;margin-top:8px;line-height:1.5}.tabs{display:flex;gap:6px;background:#eee5df;padding:5px;border-radius:15px;margin:20px 0 24px}.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;color:var(--muted);padding:10px 6px}.tabs button[aria-selected=true]{background:var(--card);color:var(--accent);box-shadow:0 1px 4px #38233815}.icon{width:20px;height:20px;flex:none}.count{font-size:11px;background:#f0e7dc;border-radius:20px;padding:3px 7px;color:#6a4c56}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}h2{font:500 25px Georgia,serif}.hint{font-size:12px;color:var(--muted)}#audio{display:grid;grid-template-columns:1fr;gap:10px}.tone-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;min-width:0}.tone-top{display:flex;align-items:center;gap:12px}.tone-cover{height:66px;width:66px;border-radius:12px;object-fit:cover;flex:none;background:#342638}.tone-info{flex:1;min-width:0}.tone-info h3{font-size:15px;line-height:1.3;overflow-wrap:anywhere}.tone-info p{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.4}.meta{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;color:#815b36}.actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}.actions button{flex:1;min-width:0;font-size:12px;padding:8px 6px;display:flex;align-items:center;justify-content:center;gap:5px}.actions .primary{background:var(--accent);border-color:var(--accent);color:#fff}.actions .icon{width:16px;height:16px}#image{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wall-card{border:1px solid var(--line);border-radius:15px;background:var(--card);overflow:hidden;min-width:0}.wall-cover{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;background:#211c21}.wall-info{padding:11px}.wall-info h3{font-size:14px;line-height:1.3}.wall-info p{font-size:11px;color:var(--muted);line-height:1.45;margin-top:4px}.wall-card .actions .primary{flex-basis:100%}.wall-card .actions{gap:5px}.wall-card .actions button{font-size:11px}.live-card{background:#352739;color:#fff5e5;border-radius:16px;padding:16px;margin-bottom:16px}.live-card h3{font-size:19px}.live-card p{font-size:13px;color:#e1d4df;margin:6px 0 12px}.live-card button{background:#f0ca8a;color:#39283c;border:0}#status{margin-top:20px;color:var(--muted)}#player{margin-top:12px;padding:12px;background:#eee5df;border-radius:12px}#player p{font-size:12px;font-weight:650;margin-bottom:8px}audio{display:block;width:100%;max-width:100%}@media(min-width:650px){main{padding:28px 28px 56px}#audio{grid-template-columns:repeat(2,minmax(0,1fr))}#image{grid-template-columns:repeat(3,minmax(0,1fr))}.wall-card .actions .primary{flex-basis:0}}@media(min-width:900px){#image{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(prefers-color-scheme:dark){:root{--paper:#141217;--card:#211d26;--ink:#f5ecdf;--muted:#c0b3c2;--accent:#704c68;--line:#3c3240}.tabs,#player{background:#2b2430}.count{background:#493c46;color:#f0d3b1}.meta{color:#e8c17e}}\n</style></head><body><main>\n<nav><a href=\"/\">‹ ISKCON Hadapsar</a><button id=\"saved\" hidden>Saved media</button></nav>\n<header class=\"hero\"><svg class=\"brand-mark\" viewBox=\"0 0 64 64\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"32\" cy=\"32\" r=\"30\" stroke=\"currentColor\" stroke-width=\"1.4\"/><circle cx=\"32\" cy=\"32\" r=\"24\" stroke=\"currentColor\" stroke-opacity=\".35\"/><path d=\"M32 42C17 41 13 31 13 24c10 1 16 6 19 13 3-7 9-12 19-13 0 7-4 17-19 18Z\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><path d=\"M32 36c-9-10-7-18 0-25 7 7 9 15 0 25ZM21 47h22\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/></svg><div><p class=\"eyebrow\">ISKCON HADAPSAR · MEDIA</p><h1>Devotion, every day.</h1><p>Personalise your phone with sacred sounds and beautiful darshan.</p></div></header>\n<div class=\"tabs\" role=\"tablist\" aria-label=\"Media type\"><button id=\"audio-tab\" role=\"tab\" aria-controls=\"audio-panel\" aria-selected=\"true\"><span data-icon=\"bell\"></span>Ringtones <span id=\"audio-count\" class=\"count\">–</span></button><button id=\"image-tab\" role=\"tab\" aria-controls=\"image-panel\" aria-selected=\"false\" tabindex=\"-1\"><span data-icon=\"image\"></span>Wallpapers <span id=\"image-count\" class=\"count\">–</span></button></div>\n<section id=\"audio-panel\" role=\"tabpanel\" aria-labelledby=\"audio-tab\"><div class=\"section-head\"><h2>Devotional ringtones</h2><span class=\"hint\">Listen · Save · Set</span></div><div id=\"audio\"></div><div id=\"player\" hidden><p id=\"playing-title\"></p><audio id=\"preview-audio\" controls preload=\"none\"></audio></div></section>\n<section id=\"image-panel\" role=\"tabpanel\" aria-labelledby=\"image-tab\" hidden><div class=\"section-head\"><h2>Divine wallpapers</h2><span class=\"hint\">Home & lock screen</span></div><div id=\"lotus\" class=\"live-card\" hidden><h3>Evening Lotus</h3><p>Live wallpaper · A gold lotus opens slowly over rippling water.</p><button type=\"button\" id=\"livePreview\">Preview live wallpaper</button></div><div id=\"image\"></div></section><p id=\"status\" role=\"status\"></p>\n</main><script>\n(function(){\nconst paths={bell:'<path d=\"M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4\"/>',image:'<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"/><path d=\"m21 15-5-5L5 21\"/>',play:'<path d=\"m8 5 12 7-12 7Z\"/>',download:'<path d=\"M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5\"/>',check:'<path d=\"m5 12 4 4L19 6\"/>',eye:'<path d=\"M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>'};\nfunction icon(key){const node=document.createElementNS('http://www.w3.org/2000/svg','svg');node.setAttribute('viewBox','0 0 24 24');node.setAttribute('fill','none');node.setAttribute('stroke','currentColor');node.setAttribute('stroke-width','1.8');node.setAttribute('stroke-linecap','round');node.setAttribute('stroke-linejoin','round');node.setAttribute('class','icon');node.setAttribute('aria-hidden','true');node.innerHTML=paths[key];return node}\ndocument.querySelectorAll('[data-icon]').forEach(n=>{n.replaceWith(icon(n.dataset.icon))});\nconst $=id=>document.getElementById(id);\nconst api=window.TempleShare;\nconst offlineMedia=api.native && navigator.userAgent.includes('HadapsarOffline/1');\n$('saved').hidden=!offlineMedia;$('saved').onclick=()=>api.openSaved();\n$('lotus').hidden=!(api.native && navigator.userAgent.includes('HadapsarLotus/1'));$('livePreview').onclick=()=>api.openLiveLotus();\nconst audio=$('preview-audio'),player=$('player');let active='audio',playingButton=null;\nfunction stop(){audio.pause();audio.removeAttribute('src');audio.load();player.hidden=true;if(playingButton){playingButton.lastChild.textContent='Listen';playingButton=null}}\nfunction tab(kind,focus){if(kind!==active){stop();active=kind}['audio','image'].forEach(k=>{const b=$(k+'-tab');const selected=k===kind;b.setAttribute('aria-selected',String(selected));b.tabIndex=selected?0:-1;$(k+'-panel').hidden=!selected});if(focus)$(kind+'-tab').focus()}\n['audio','image'].forEach(k=>{$(k+'-tab').onclick=()=>tab(k,false);$(k+'-tab').addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();tab(e.key==='Home'?'audio':e.key==='End'?'image':k==='audio'?'image':'audio',true)}})});\nfunction btn(label,key,fn,primary){const b=document.createElement('button');b.type='button';b.append(icon(key),document.createTextNode(label));b.onclick=fn;if(primary)b.className='primary';return b}\nfunction el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=text;return n}\nfunction preview(item,button,box){if(offlineMedia){api.previewMedia(item.url,item.title);return}if(item.kind==='image'){location.assign(item.url);return}if(playingButton===button&&!audio.paused){stop();return}stop();box.append(player);$('playing-title').textContent=item.title;player.hidden=false;audio.src=item.url;playingButton=button;button.lastChild.textContent='Stop';audio.play().catch(()=>{$('status').textContent='Use the audio player to start playback.'})}\naudio.addEventListener('ended',stop);audio.addEventListener('error',()=>{if(audio.getAttribute('src')){$('status').textContent='Audio unavailable. Please try again.';stop()}});\nwindow.addEventListener('pagehide',stop);\nfunction card(item){const kind=item.kind;if(kind!=='audio'&&kind!=='image')return;const tone=kind==='audio',box=el('article',tone?'tone-card':'wall-card'),info=el('div',tone?'tone-info':'wall-info'),actions=el('div','actions');\n const im=el('img',tone?'tone-cover':'wall-cover');im.src=item.thumbnail||item.url;im.alt='';im.loading='lazy';im.decoding='async';im.width=tone?66:360;im.height=tone?66:640;\n info.append(el('h3','',item.title),el('p','',item.description||''));\n if(tone&&Number.isFinite(item.durationSeconds))info.append(el('span','meta',item.durationSeconds+' sec · MP3'));\n if(tone){const top=el('div','tone-top');top.append(im,info);box.append(top)}else{box.append(im,info)}\n const listen=btn(tone?'Listen':'View',tone?'play':'eye',()=>preview(item,listen,box));\n actions.append(listen,btn('Save','download',()=>api.download(item.url,item.title)),btn(tone?'Set ringtone':'Set wallpaper','check',()=>{stop();tone?api.setRingtone(item.url,item.title):api.setWallpaper(item.url,item.title)},true));\n (tone?box:info).append(actions);$(kind).append(box)\n}\nfetch('/media/catalog.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(items=>{['audio','image'].forEach(k=>$(k+'-count').textContent=items.filter(i=>i.kind===k).length);items.filter(i=>i.kind==='audio'&&i.durationSeconds).forEach(card);items.filter(i=>i.kind!=='audio'||!i.durationSeconds).forEach(card)}).catch(()=>{$('status').textContent='Catalog unavailable. Open Saved media in the app for downloaded items.'});\nif(location.hash==='#wallpapers')tab('image',false);\n})();\n</script></body></html>\n")
          for item in items:
              for key in ("url","thumbnail"):
                  assert Path(item[key].lstrip("/")).is_file(), item[key]
          assert sum(i.get("kind")=="audio" for i in items)>=8
          print("Validated six original MP3 files, artwork and all catalog paths")
          
          PY
          python -c 'from pathlib import Path; import re; Path("/tmp/media-check.js").write_text(re.findall(r"<script>(.*?)</script>",Path("media.html").read_text(),re.S)[0])'
          node --check /tmp/media-check.js
      - name: Publish verified media assets and interface atomically
        run: |
          git config user.name 'media-refresh-bot'
          git config user.email 'media-refresh-bot@users.noreply.github.com'
          git add media media.html
          git commit -m 'Add six devotional ringtones, individual artwork and separate media tabs'
          git push origin HEAD:main
